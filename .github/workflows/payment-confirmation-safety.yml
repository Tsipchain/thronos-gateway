name: Payment Confirmation Safety Tests

on:
  push:
    branches: [main, "fix/crypto-confirmation-safety"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test payment confirmation safety
        run: npm test -- --runInBand --coverage=false
